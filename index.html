<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>逃生舱 · 文章列表</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #090A0B;
    --bg-card: #111214;
    --bg-elevated: #191B1E;
    --bg-input: #141618;
    --border: #2A2D31;
    --border-subtle: #1E2124;
    --text: #E8E9EB;
    --text-secondary: #9BA1A8;
    --text-muted: #6B7280;
    --accent: #2ADB5C;
    --accent-dim: rgba(42, 219, 92, 0.12);
    --accent-hover: rgba(42, 219, 92, 0.08);
    --font-body: 'Inter', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    --max-w: 860px;
    --radius: 8px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; }

  body {
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--text);
    line-height: 1.75;
    font-size: 16px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .container {
    max-width: var(--max-w);
    margin: 0 auto;
    padding: 0 2rem;
    width: 100%;
  }

  /* ── Header ── */
  .header {
    padding: 3.5rem 0 2rem;
    text-align: center;
  }
  .header h1 {
    font-size: clamp(1.6rem, 4vw, 2.2rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 0.5rem;
  }
  .header h1 span { color: var(--accent); }
  .header .subtitle {
    color: var(--text-muted);
    font-size: 0.9rem;
  }

  /* ── Toolbar ── */
  .toolbar {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin-bottom: 1.5rem;
    flex-wrap: wrap;
  }
  .search-box {
    flex: 1;
    min-width: 200px;
    position: relative;
  }
  .search-box svg {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    pointer-events: none;
  }
  .search-box input {
    width: 100%;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 0.65rem 1rem 0.65rem 2.5rem;
    color: var(--text);
    font-size: 0.88rem;
    font-family: var(--font-body);
    outline: none;
    transition: border-color 0.2s;
  }
  .search-box input::placeholder { color: var(--text-muted); }
  .search-box input:focus { border-color: var(--accent); }

  .page-size-select {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.82rem;
    color: var(--text-muted);
    flex-shrink: 0;
  }
  .page-size-select select {
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 0.55rem 0.75rem;
    color: var(--text);
    font-size: 0.82rem;
    font-family: var(--font-body);
    outline: none;
    cursor: pointer;
    transition: border-color 0.2s;
  }
  .page-size-select select:focus { border-color: var(--accent); }

  /* ── Stats ── */
  .stats {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1rem;
    font-size: 0.8rem;
    color: var(--text-muted);
  }

  /* ── Article List ── */
  .article-list {
    display: flex;
    flex-direction: column;
    gap: 0;
  }
  .article-item {
    display: flex;
    align-items: center;
    gap: 1.25rem;
    padding: 1.1rem 1.25rem;
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius);
    margin-bottom: 0.6rem;
    background: var(--bg-card);
    transition: border-color 0.2s, background 0.2s;
    text-decoration: none;
    color: inherit;
    cursor: pointer;
  }
  .article-item:hover {
    border-color: var(--accent);
    background: var(--accent-hover);
  }
  .article-date {
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--accent);
    white-space: nowrap;
    flex-shrink: 0;
    min-width: 90px;
    letter-spacing: 0.02em;
  }
  .article-title {
    font-size: 0.92rem;
    font-weight: 500;
    color: var(--text);
    flex: 1;
    line-height: 1.5;
  }
  .article-arrow {
    color: var(--text-muted);
    flex-shrink: 0;
    transition: transform 0.2s, color 0.2s;
  }
  .article-item:hover .article-arrow {
    transform: translateX(3px);
    color: var(--accent);
  }

  /* ── Empty State ── */
  .empty-state {
    text-align: center;
    padding: 4rem 1rem;
    color: var(--text-muted);
  }
  .empty-state svg { margin-bottom: 1rem; opacity: 0.4; }
  .empty-state p { font-size: 0.9rem; }

  /* ── Pagination ── */
  .pagination {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
    margin: 2rem 0 3rem;
    flex-wrap: wrap;
  }
  .page-btn {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.45rem 0.85rem;
    color: var(--text-secondary);
    font-size: 0.82rem;
    font-family: var(--font-body);
    cursor: pointer;
    transition: border-color 0.2s, color 0.2s, background 0.2s;
    user-select: none;
  }
  .page-btn:hover:not(:disabled):not(.active) {
    border-color: var(--accent);
    color: var(--text);
  }
  .page-btn.active {
    background: var(--accent-dim);
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 600;
  }
  .page-btn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }
  .page-ellipsis {
    color: var(--text-muted);
    font-size: 0.82rem;
    padding: 0 0.3rem;
    user-select: none;
  }

  /* ── Loading ── */
  .loading {
    text-align: center;
    padding: 4rem 1rem;
    color: var(--text-muted);
    font-size: 0.9rem;
  }
  .loading .spinner {
    display: inline-block;
    width: 20px;
    height: 20px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-right: 0.5rem;
    vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Error ── */
  .error-state {
    text-align: center;
    padding: 3rem 1rem;
    color: var(--text-muted);
    font-size: 0.88rem;
  }
  .error-state .error-icon {
    color: #EF4444;
    margin-bottom: 0.75rem;
  }

  /* ── Footer ── */
  .footer {
    margin-top: auto;
    padding: 2rem;
    text-align: center;
    border-top: 1px solid var(--border-subtle);
    color: var(--text-muted);
    font-size: 0.75rem;
  }

  /* ── Responsive ── */
  @media (max-width: 640px) {
    .container { padding: 0 1.25rem; }
    .header { padding: 2.5rem 0 1.5rem; }
    .article-item { padding: 0.9rem 1rem; gap: 0.75rem; }
    .article-date { min-width: 78px; font-size: 0.72rem; }
    .article-title { font-size: 0.85rem; }
    .toolbar { gap: 0.75rem; }
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>逃生舱 · <span>文章列表</span></h1>
    <p class="subtitle">所有文章按时间倒序排列，支持搜索与分页</p>
  </div>

  <div class="toolbar">
    <div class="search-box">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="text" id="searchInput" placeholder="按标题搜索..." autocomplete="off">
    </div>
    <div class="page-size-select">
      <span>每页</span>
      <select id="pageSizeSelect">
        <option value="5">5</option>
        <option value="10" selected>10</option>
        <option value="20">20</option>
        <option value="50">50</option>
      </select>
      <span>篇</span>
    </div>
  </div>

  <div class="stats" id="stats"></div>

  <div id="articleListContainer">
    <div class="loading"><span class="spinner"></span>加载中...</div>
  </div>

  <div class="pagination" id="pagination"></div>
</div>

<footer class="footer">
  <p>逃生舱 · Escape Capsule</p>
</footer>

<script>
(function () {
  'use strict';

  let allArticles = [];
  let filtered = [];
  let currentPage = 1;
  let pageSize = 10;
  let searchQuery = '';

  const searchInput = document.getElementById('searchInput');
  const pageSizeSelect = document.getElementById('pageSizeSelect');
  const listContainer = document.getElementById('articleListContainer');
  const paginationContainer = document.getElementById('pagination');
  const statsContainer = document.getElementById('stats');

  async function init() {
    try {
      const res = await fetch('articles.json');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      allArticles = await res.json();
      allArticles.sort(function (a, b) {
        return b.createdAt.localeCompare(a.createdAt);
      });
      applyFilter();
    } catch (e) {
      listContainer.innerHTML =
        '<div class="error-state">' +
          '<div class="error-icon"><svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></svg></div>' +
          '<p>加载文章数据失败，请检查 articles.json 是否存在。</p>' +
          '<p style="margin-top:0.5rem;font-size:0.78rem;color:#6B7280;">' + e.message + '</p>' +
        '</div>';
    }
  }

  function applyFilter() {
    var q = searchQuery.trim().toLowerCase();
    if (q === '') {
      filtered = allArticles.slice();
    } else {
      filtered = allArticles.filter(function (a) {
        return a.title.toLowerCase().indexOf(q) !== -1;
      });
    }
    currentPage = 1;
    render();
  }

  function render() {
    var total = filtered.length;
    var totalPages = Math.max(1, Math.ceil(total / pageSize));
    if (currentPage > totalPages) currentPage = totalPages;

    var start = (currentPage - 1) * pageSize;
    var end = Math.min(start + pageSize, total);
    var pageItems = filtered.slice(start, end);

    renderStats(total, start, end);
    renderList(pageItems);
    renderPagination(totalPages);
  }

  function renderStats(total, start, end) {
    if (total === 0) {
      statsContainer.textContent = searchQuery ? '未找到匹配的文章' : '暂无文章';
    } else {
      statsContainer.textContent = '共 ' + total + ' 篇，显示第 ' + (start + 1) + '-' + end + ' 篇';
    }
  }

  function renderList(items) {
    if (items.length === 0) {
      listContainer.innerHTML =
        '<div class="empty-state">' +
          '<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/><line x1="10" x2="8" y1="9" y2="9"/></svg>' +
          '<p>' + (searchQuery ? '没有与 "' + escapeHtml(searchQuery) + '" 匹配的文章' : '暂无文章') + '</p>' +
        '</div>';
      return;
    }

    var html = '<div class="article-list">';
    for (var i = 0; i < items.length; i++) {
      var item = items[i];
      html +=
        '<a class="article-item" href="' + escapeAttr(item.htmlFile) + '">' +
          '<span class="article-date">' + escapeHtml(item.createdAt) + '</span>' +
          '<span class="article-title">' + highlightTitle(item.title) + '</span>' +
          '<span class="article-arrow"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></span>' +
        '</a>';
    }
    html += '</div>';
    listContainer.innerHTML = html;
  }

  function highlightTitle(title) {
    var q = searchQuery.trim();
    if (q === '') return escapeHtml(title);
    var idx = title.toLowerCase().indexOf(q.toLowerCase());
    if (idx === -1) return escapeHtml(title);
    return escapeHtml(title.substring(0, idx)) +
      '<mark style="background:rgba(42,219,92,0.25);color:inherit;border-radius:2px;padding:0 1px;">' +
      escapeHtml(title.substring(idx, idx + q.length)) +
      '</mark>' +
      escapeHtml(title.substring(idx + q.length));
  }

  function renderPagination(totalPages) {
    if (totalPages <= 1) {
      paginationContainer.innerHTML = '';
      return;
    }

    var html = '';

    html += '<button class="page-btn" data-page="prev"' + (currentPage === 1 ? ' disabled' : '') + '>&laquo; 上一页</button>';

    var pages = buildPageNumbers(currentPage, totalPages);
    for (var i = 0; i < pages.length; i++) {
      if (pages[i] === '...') {
        html += '<span class="page-ellipsis">...</span>';
      } else {
        html += '<button class="page-btn' + (pages[i] === currentPage ? ' active' : '') + '" data-page="' + pages[i] + '">' + pages[i] + '</button>';
      }
    }

    html += '<button class="page-btn" data-page="next"' + (currentPage === totalPages ? ' disabled' : '') + '>下一页 &raquo;</button>';

    paginationContainer.innerHTML = html;
  }

  function buildPageNumbers(current, total) {
    if (total <= 7) {
      var arr = [];
      for (var i = 1; i <= total; i++) arr.push(i);
      return arr;
    }
    var pages = [1];
    if (current > 3) pages.push('...');
    var rangeStart = Math.max(2, current - 1);
    var rangeEnd = Math.min(total - 1, current + 1);
    for (var j = rangeStart; j <= rangeEnd; j++) pages.push(j);
    if (current < total - 2) pages.push('...');
    pages.push(total);
    return pages;
  }

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.appendChild(document.createTextNode(str));
    return div.innerHTML;
  }

  function escapeAttr(str) {
    return str.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  var searchTimer = null;
  searchInput.addEventListener('input', function () {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function () {
      searchQuery = searchInput.value;
      applyFilter();
    }, 200);
  });

  pageSizeSelect.addEventListener('change', function () {
    pageSize = parseInt(pageSizeSelect.value, 10);
    currentPage = 1;
    render();
  });

  paginationContainer.addEventListener('click', function (e) {
    var btn = e.target.closest('.page-btn');
    if (!btn || btn.disabled) return;
    var page = btn.getAttribute('data-page');
    if (page === 'prev') {
      if (currentPage > 1) currentPage--;
    } else if (page === 'next') {
      currentPage++;
    } else {
      currentPage = parseInt(page, 10);
    }
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  init();
})();
</script>

</body>
</html>
